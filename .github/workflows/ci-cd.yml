name: MarketZen CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      #  FIX 1: Upgrade Node version
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"

      # ===== BACKEND =====
      - name: Install server deps
        run: |
          cd server
          npm ci

      - name: Test server
        run: |
          cd server
          npm test || echo "No tests yet"

      # ===== FRONTEND =====
      - name: Clean install frontend deps
        run: |
          cd frontend
          rm -rf node_modules package-lock.json
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  deploy:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy placeholder
        run: echo "Deploy step comes next"